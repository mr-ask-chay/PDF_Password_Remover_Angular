<header class="sticky-top border-bottom border-opacity-25">
  <nav class="navbar navbar-expand-md bg-body bg-opacity-75 backdrop-blur">
    <div class="container-lg py-2">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/" aria-label="Unclasp home">
        <img class="brand-logo brand-logo-light" src="/assets/brand/unclasp-logo.svg" alt="" width="120" height="32" />
        <img class="brand-logo brand-logo-dark" src="/assets/brand/unclasp-logo-dark.svg" alt="" width="120" height="32" />
      </a>

      <button
        #menuToggle
        class="navbar-toggler"
        type="button"
        aria-controls="navMain"
        [attr.aria-expanded]="menuOpen"
        [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'"
        (click)="toggleMenu()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain" [class.show]="menuOpen">
        <ul class="navbar-nav ms-auto mb-2 mb-md-0 me-md-3 small align-items-md-center">
          <li class="nav-item">
            <a class="nav-link" (click)="closeMenu()" routerLink="/pdf-tools">Tools</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="closeMenu()" routerLink="/docs">Documentation</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="closeMenu()" routerLink="/about">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="closeMenu()" routerLink="/contact">Contact</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 ms-md-2">
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="toggleTheme()"
            aria-live="polite"
          >
            Theme: {{ label }}
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
